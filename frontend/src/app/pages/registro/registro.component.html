<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light">
  <div class="w-100" style="max-width: 420px;">

    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center rounded-3 mb-3 logo-icon-auth">
        <i class="bi bi-diagram-3 text-white fs-3"></i>
      </div>
      <h1 class="h3 fw-bold text-dark">Crear cuenta</h1>
      <p class="text-secondary">Registrate en {{ nombreSitio }}</p>
    </div>

    <div class="card border shadow-sm rounded-3 p-4">
      <div class="alert alert-danger py-2 small" *ngIf="error">{{ error }}</div>

      <div class="mb-3">
        <label class="form-label fw-medium">Nombre completo</label>
        <input type="text" class="form-control" [(ngModel)]="nombre" placeholder="Juan Pérez">
      </div>

      <div class="mb-3">
        <label class="form-label fw-medium">Email</label>
        <input type="email" class="form-control" [(ngModel)]="email" placeholder="tu@email.com">
      </div>

      <div class="mb-3">
        <label class="form-label fw-medium">Contraseña</label>
        <input type="password" class="form-control" [(ngModel)]="password" placeholder="Mínimo 6 caracteres">
      </div>

      <div class="mb-4">
        <label class="form-label fw-medium">Confirmar contraseña</label>
        <input type="password" class="form-control" [(ngModel)]="confirmar" placeholder="Repetí tu contraseña">
      </div>

      <button class="btn btn-dark w-100 py-2 fw-medium" (click)="registrar()" [disabled]="loading">
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
        Crear cuenta
      </button>

      <div class="text-center mt-3">
        <span class="text-secondary small">¿Ya tenés cuenta? </span>
        <a routerLink="/login" class="text-dark fw-medium small">Iniciá sesión</a>
      </div>
    </div>

  </div>
</div>

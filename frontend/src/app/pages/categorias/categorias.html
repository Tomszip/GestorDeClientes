<!-- Header -->
<div class="d-flex align-items-center justify-content-between mb-4">
  <div>
    <h1 class="h3 fw-bold text-dark mb-1">Categorías</h1>
    <p class="text-secondary mb-0">Administrá las categorías de contenido del sitio</p>
  </div>
  <button class="btn btn-dark btn-sm" (click)="abrirFormularioNuevo()">
    <i class="bi bi-plus-lg me-1"></i>Nueva Categoría
  </button>
</div>

<div class="alert alert-danger py-2 small" *ngIf="error">{{ error }}</div>

<!-- Formulario de alta/edición -->
<div class="card border rounded-3 shadow-sm p-4 mb-4" *ngIf="mostrandoFormulario">
  <h2 class="h6 fw-semibold text-dark mb-3">{{ categoriaEditando ? 'Editar categoría' : 'Nueva categoría' }}</h2>

  <div class="mb-3">
    <label class="form-label fw-medium">Nombre *</label>
    <input type="text" class="form-control" [(ngModel)]="nombre" placeholder="Ej: Documentos, Marketing, Fotos...">
  </div>
  <div class="mb-3">
    <label class="form-label fw-medium">Descripción (opcional)</label>
    <textarea class="form-control" rows="2" [(ngModel)]="descripcion" placeholder="Para qué se usa esta categoría"></textarea>
  </div>

  <div class="d-flex gap-2">
    <button class="btn btn-dark" (click)="guardarCategoria()" [disabled]="guardando">
      <span *ngIf="guardando" class="spinner-border spinner-border-sm me-2"></span>
      Guardar
    </button>
    <button class="btn btn-outline-secondary" (click)="cerrarFormulario()">Cancelar</button>
  </div>
</div>

<div class="p-3 text-secondary" *ngIf="cargando">
  <span class="spinner-border spinner-border-sm me-2"></span>Cargando...
</div>

<!-- Tabla -->
<div class="card border rounded-3 shadow-sm overflow-hidden" *ngIf="!cargando">
  <div class="table-responsive">
    <table class="table table-hover mb-0 align-middle">
      <thead class="table-light border-bottom">
        <tr>
          <th class="px-4 py-3 fw-semibold text-dark">Nombre</th>
          <th class="px-4 py-3 fw-semibold text-dark">Descripción</th>
          <th class="px-4 py-3 fw-semibold text-dark">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let c of categorias">
          <td class="px-4 py-3 fw-medium text-dark">{{ c.nombre }}</td>
          <td class="px-4 py-3 text-secondary small">{{ c.descripcion || '—' }}</td>
          <td class="px-4 py-3">
            <div class="d-flex gap-1">
              <button class="btn btn-sm btn-light px-2" title="Editar" (click)="abrirFormularioEditar(c)">
                <i class="bi bi-pencil text-secondary"></i>
              </button>
              <button class="btn btn-sm btn-light px-2" title="Eliminar" (click)="eliminar(c.id)">
                <i class="bi bi-trash text-danger"></i>
              </button>
            </div>
          </td>
        </tr>
        <tr *ngIf="categorias.length === 0">
          <td colspan="3" class="text-center text-secondary py-5">
            <i class="bi bi-tags fs-1 d-block mb-2"></i>
            No hay categorías creadas todavía.
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
